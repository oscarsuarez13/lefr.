# Base44 sandbox dev config: serves the static dashboard straight from the
# bind-mounted repo (edits are live), with caching disabled.
# Workers run as root because the checkout is root-owned (mode 700) in the
# sandbox, so the unprivileged nginx user cannot read it.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    add_header Cache-Control "no-store" always;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The whole repo is mounted, so never serve hidden files (.git, .base44).
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
